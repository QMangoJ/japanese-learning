<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>日本語上手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#22272e; --sub:#6a737d; --line:#e3e6ea;
  --accent:#c0392b; --accent-soft:#fdf0ee; --blue:#2b6cb0; --blue-soft:#ebf3fb;
  --green:#2f855a; --green-soft:#ecf7f0; --amber:#b7791f; --amber-soft:#fdf6e9;
  --red:#c0392b; --red-soft:#fdecea;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04); --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171c; --card:#1e232a; --ink:#e6e9ed; --sub:#98a1ab; --line:#313842;
    --accent:#e57365; --accent-soft:#33231f; --blue:#6ea8dc; --blue-soft:#1e2a38;
    --green:#7cc39a; --green-soft:#1d2c24; --amber:#d9a557; --amber-soft:#2e2718;
    --red:#e57373; --red-soft:#3a2323;
    --shadow:0 1px 3px rgba(0,0,0,.4);}
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{margin:0;padding:0;max-width:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans","Hiragino Kaku Gothic ProN","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:16px;line-height:1.65;padding-bottom:calc(64px + env(safe-area-inset-bottom));overflow-wrap:break-word}
.jp{font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP","PingFang SC",sans-serif}
.topbar{position:sticky;top:0;z-index:20}
header.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
header.top .back{border:none;background:none;color:var(--blue);font-size:15px;padding:4px 6px;cursor:pointer;flex:none}
header.top h1{font-size:16px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modewrap{background:var(--card);border-bottom:1px solid var(--line)}
.levelbar{display:flex;gap:8px;justify-content:center;padding:8px 14px 5px}
.levelbar button{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:999px;padding:5px 26px;font-size:14px;font-weight:800;letter-spacing:.5px;cursor:pointer;min-width:84px}
.levelbar button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.typebar{display:flex;gap:6px;justify-content:center;padding:0 14px 8px}
.typebar button{flex:1;max-width:170px;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:999px;padding:6px 0;font-size:14px;font-weight:700;cursor:pointer}
.langbar{display:flex;gap:4px;flex:none}
.langbar button{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer}
.langbar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.typebar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.week-card{cursor:pointer}
.week-card h2{margin:0 0 2px;font-size:18px}
.week-card .sub{color:var(--sub);font-size:13px}
.day-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}
.day-item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--bg)}
.day-item:active{transform:scale(.98)}
.day-item .d{font-size:12px;color:var(--accent);font-weight:700}
.day-item .t{font-size:14px;font-weight:600}
.day-item .tc{font-size:12px;color:var(--sub)}
.dialog{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.dialog .cn{color:var(--sub);font-size:13px;margin-top:6px}
.point{margin-top:14px}
.point h3{margin:0;font-size:17.5px;background:linear-gradient(transparent 62%,var(--accent-soft) 62%);display:inline;padding:0 2px;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:2px}
.ex .jp u,.dialog u{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:2px;font-weight:600}
.point .reading{color:var(--sub);font-size:12.5px;margin:2px 0 6px}
.conn{background:var(--blue-soft);color:var(--blue);border-radius:8px;padding:6px 10px;font-size:13.5px;margin:6px 0;display:inline-block}
.usage{font-size:14.5px;margin:4px 0}
.usage .cn{color:var(--accent);font-weight:600}
.ex{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0}
.ex .jp{font-size:15.5px}
.ex .eq{color:var(--sub);font-size:13px}
.ex .cn{color:var(--sub);font-size:13.5px}
.note{font-size:13.5px;margin:6px 0;padding:6px 10px;border-radius:8px;background:var(--green-soft)}
.note b.nt{color:var(--green);margin-right:6px}
.note.dame{background:var(--accent-soft)}
.note.dame b.nt{color:var(--accent)}
.sec-title{font-size:15px;font-weight:700;color:var(--accent);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.sec-title small{color:var(--sub);font-weight:400;font-size:12px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.q{margin:10px 0;font-size:15px}
.q .n{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:var(--blue-soft);color:var(--blue);border-radius:6px;font-size:12.5px;font-weight:700;margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opts span{border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:13.5px;background:var(--bg);max-width:100%;overflow-wrap:break-word}
.ansbtn{border:1px dashed var(--blue);background:none;color:var(--blue);border-radius:8px;padding:4px 12px;font-size:13.5px;cursor:pointer;margin:8px 0}
.answer{display:none;background:var(--green-soft);border-radius:8px;padding:8px 12px;font-size:14px;margin-top:6px}
.answer.show{display:block}
.opt-btn{border:1px solid var(--line);border-radius:8px;padding:3px 11px;font-size:13.5px;background:var(--bg);color:var(--ink);max-width:100%;overflow-wrap:break-word;cursor:pointer;font-family:inherit}
.opt-btn:active{transform:scale(.97)}
.qz.answered .opt-btn{cursor:default}
.qz.answered .opt-btn:active{transform:none}
.qz.answered .opt-btn.correct{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
.qz.answered .opt-btn.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red);font-weight:700}
.qz-note{display:none;background:var(--amber-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13.5px;margin-top:6px;line-height:1.6}
.qz-note.show{display:block}
.qz-result{font-size:12.5px;font-weight:700;margin-top:4px}
.qz-result.ok{color:var(--green)}
.qz-result.ng{color:var(--red)}
.answer b{color:var(--green)}
.passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:8px 0;white-space:pre-wrap}
.meta{color:var(--sub);font-size:13px}
.keigo{background:var(--amber-soft);border-radius:10px;padding:10px 14px;margin-top:16px}
.keigo h4{margin:0 0 6px;font-size:15px;color:var(--amber)}
.keigo li{font-size:14px}
/* vocab rows */
.vrow{display:flex;gap:10px;padding:8px 0;border-top:1px dashed var(--line);align-items:flex-start}
.vrow:first-child{border-top:0}
.vjp{flex:0 0 42%;min-width:0;font-size:16px;font-weight:600;word-break:break-word}
.vmn{flex:1;min-width:0}
.vcn{color:var(--ink);word-break:break-word}
.ven{color:var(--sub);font-size:12.5px;display:block}
.vrel{color:var(--green);font-size:12.5px;display:block;margin-top:2px;word-break:break-word}
.vnote{color:var(--sub);font-size:12px;display:block;margin-top:2px;font-style:italic}
.fillin-pat{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:8px 12px;font-size:14.5px;margin-bottom:8px;font-weight:600}
@media (max-width:520px){
  .vrow{flex-direction:column;gap:2px}
  .vjp{flex:none;width:100%}
}
.kanji-card{padding:6px 16px}
.krow{display:flex;gap:14px;padding:14px 0;border-top:1px dashed var(--line);align-items:flex-start}
.krow:first-child{border-top:0}
.kchar-wrap{flex:0 0 auto;width:74px;text-align:center}
.kchar{font-size:42px;font-weight:700;line-height:1.1}
.kmeta{color:var(--sub);font-size:11px;margin-top:2px}
.kreads{color:var(--blue);font-size:12.5px;margin-top:2px;line-height:1.6}
.kread{white-space:nowrap;display:inline-block}
.kread+.kread::before{content:"　"}
.kwords{flex:1;min-width:0}
@media (max-width:520px){
  .krow{gap:10px}
  .kchar-wrap{width:56px}
  .kchar{font-size:32px}
}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:none;background:none;color:var(--sub);font-size:11.5px;padding:7px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.bottom button .ic{font-size:19px;line-height:1.2}
nav.bottom button.on{color:var(--accent);font-weight:700}
.search-box{display:flex;gap:8px;margin-bottom:12px}
.search-box input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px;background:var(--card);color:var(--ink);outline:none}
.search-box input:focus{border-color:var(--blue)}
.search-hist{margin-bottom:14px}
.search-hist-h{color:var(--sub);font-size:12.5px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.search-hist-h a{color:var(--blue);cursor:pointer;font-size:12.5px}
.search-hist-chips{display:flex;flex-wrap:wrap;gap:8px}
.hist-chip{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:13.5px;cursor:pointer}
.hist-chip:hover{border-color:var(--blue);color:var(--blue)}
.result{cursor:pointer}
.result .where{color:var(--sub);font-size:12.5px}
.mtag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-right:6px;vertical-align:middle}
.mtag.g{background:var(--accent-soft);color:var(--accent)}
.mtag.g2{background:var(--amber-soft);color:var(--amber)}
.mtag.v{background:var(--blue-soft);color:var(--blue)}
.mtag.k{background:var(--green-soft);color:var(--green)}
.mtag.v2{background:var(--amber-soft);color:var(--amber)}
.mtag.k2{background:var(--amber-soft);color:var(--amber)}
.hl{background:var(--amber-soft);color:var(--amber);font-weight:700;padding:0 1px;border-radius:3px}
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc-filter{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.fc-filter button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;font-size:13.5px;cursor:pointer}
.fc-filter button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fcard{width:100%;max-width:520px;min-height:280px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.fcard .big{font-size:26px;font-weight:700}
.fcard .hint{color:var(--sub);font-size:12.5px;margin-top:16px}
.fcard .backside{text-align:left;width:100%}
.fc-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fc-btns button{flex:1 1 auto;min-width:92px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 16px;font-size:15px;cursor:pointer;white-space:nowrap}
.fc-btns button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.fc-prog{color:var(--sub);font-size:13px}
table.ref{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
table.ref th,table.ref td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
table.ref th{background:var(--bg)}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.toggle-all{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;margin-left:auto}
h2.page{font-size:19px;margin:4px 0 12px}
.empty{color:var(--sub);text-align:center;padding:40px 0}
.crumb{color:var(--sub);font-size:13px;margin-bottom:8px}
a.plink{color:var(--blue);text-decoration:none}
del{text-decoration:line-through;color:var(--sub)}
ruby rt{font-size:.55em;color:var(--sub);letter-spacing:0;user-select:none}
body.no-ruby rt{display:none}
.mem-bar{display:flex;gap:8px;margin-bottom:12px;position:sticky;top:var(--topbarh,97px);z-index:15;background:var(--bg);padding:8px 0 4px}
.mem-bar button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:6px 0;font-size:13px;font-weight:700;cursor:pointer}
.mem-bar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
body.hide-jp .vjp-text{visibility:hidden}
body.hide-cn .vcn,body.hide-cn .ven{visibility:hidden}
.conn-hint{font-size:11.5px;color:var(--sub);margin-left:6px}
.hito{font-style:italic;color:var(--green);border-left:3px solid var(--green)}
.sayb{border:none;background:none;cursor:pointer;font-size:14px;padding:0 3px;color:var(--blue);vertical-align:middle;opacity:.55}
.sayb:hover,.sayb:active{opacity:1}
.starb{border:none;background:none;cursor:pointer;font-size:17px;padding:0 3px;color:var(--amber);vertical-align:middle;line-height:1;opacity:.85}
.point h3 .starb,.point h3 .sayb{font-size:15px}
.fav-actions{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.fav-actions button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 14px;font-size:14px;cursor:pointer}
.fav-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.fav-item{display:flex;gap:8px;align-items:baseline;padding:10px 0;border-top:1px dashed var(--line)}
.fav-item:first-child{border-top:0}
.fav-item .fj{flex:1;min-width:0;cursor:pointer}
.fav-item .fj .t{font-weight:600;font-size:15.5px}
.fav-item .fj .c{color:var(--sub);font-size:13px}
.fav-item .fw{color:var(--sub);font-size:11.5px;white-space:nowrap}
.mistake-widget{margin-bottom:14px}
.mistake-types{display:flex;gap:6px;margin-bottom:8px}
.mistake-types button{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.mistake-types button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mistake-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14.5px;background:var(--bg);color:var(--ink);resize:vertical;font-family:inherit;box-sizing:border-box}
.mistake-widget>button[data-mistake-add]{margin-top:8px;border:none;background:var(--accent);color:#fff;border-radius:8px;padding:7px 16px;font-size:14px;font-weight:700;cursor:pointer}
.mistake-item{padding:8px 0;border-top:1px dashed var(--line)}
.mistake-item:first-child{border-top:0}
.mistake-item-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mistake-date{color:var(--sub);font-size:12px}
.mistake-del{margin-left:auto;border:none;background:none;color:var(--sub);cursor:pointer;font-size:13px;padding:2px 4px}
.mistake-del:hover{color:var(--accent)}
.mistake-text{font-size:14.5px;line-height:1.6;white-space:pre-wrap}
.mt-q{background:var(--accent-soft);color:var(--accent)}
.mt-word{background:var(--blue-soft);color:var(--blue)}
.mt-grammar{background:var(--green-soft);color:var(--green)}
.ct-h{font-size:16px;margin:0 0 8px;color:var(--accent)}
.ct-tip{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:10px;line-height:1.5}
.ct-row{padding:9px 0;border-top:1px dashed var(--line)}
.ct-form{font-weight:600;font-size:15px}
.ct-loc{color:var(--blue);font-size:12px;margin-left:8px;cursor:pointer;white-space:nowrap}
.ct-eg{font-size:14px;margin:2px 0 0}
.ct-egcn{color:var(--sub);font-size:13px;margin:0 0 2px}
.ct-mean{font-size:14px}
.ct-daysum{margin-bottom:10px}
.ct-daysum h4{margin:0 0 8px;font-size:15px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.ct-daysum h4 .meta{font-weight:400}
.ct-daysum h4 a.plink{margin-left:auto;font-size:13px}
.ct-daysum ul{margin:0;padding-left:18px}
.ct-daysum li{margin:6px 0;font-size:14.5px;line-height:1.5}
.ct-daysum li .ct-mean{color:var(--sub)}
.ct-wrap{display:flex;gap:16px;align-items:flex-start}
.ct-toc{position:sticky;top:150px;flex:0 0 168px;max-height:calc(100vh - 168px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.ct-toc-h{font-size:12px;color:var(--sub);font-weight:700;padding:4px 8px}
.ct-tocitem{display:block;padding:6px 8px;font-size:13px;color:var(--ink);cursor:pointer;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-tocitem:hover{background:var(--bg);color:var(--accent)}
.ct-body{flex:1;min-width:0}
.ct-card{scroll-margin-top:150px}
@media (max-width:680px){
  .ct-wrap{flex-direction:column;gap:8px;align-items:stretch}
  .ct-toc{top:148px;flex:none;width:100%;max-width:100%;box-sizing:border-box;max-height:none;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;z-index:10;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .ct-toc-h{display:none}
  .ct-tocitem{flex:0 0 auto;background:var(--bg);border:1px solid var(--line)}
  .ct-body{min-width:0;max-width:100%}
  .ct-card{scroll-margin-top:190px}
}
.home-top{position:sticky;top:var(--topbarh,97px);z-index:10;background:var(--bg);padding-bottom:4px}
.wk-toc{display:none}
.home-tools{display:flex;gap:8px;margin-bottom:14px}
.home-tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 4px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.home-tool .ic{font-size:18px}
.home-tool:hover{border-color:var(--accent);color:var(--accent)}
.week-card{scroll-margin-top:calc(var(--topbarh,97px) + var(--hometoph,40px))}
@media (max-width:680px){
  .wk-toc{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 4px;width:100%;max-width:100%;box-sizing:border-box;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .wk-tocitem{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
  .wk-tocitem:hover{color:var(--accent)}
}
/* PC端正文字号调大一号，读音注音跟着放大，减轻长时间阅读的眼睛负担 */
@media (min-width:681px){
  body{font-size:17px}
  ruby rt{font-size:.65em}
  .point h3{font-size:19px}
  .point .reading{font-size:14px}
  .conn{font-size:14.5px}
  .usage{font-size:16px}
  .ex .jp{font-size:17px}
  .ex .eq{font-size:14.5px}
  .ex .cn{font-size:15px}
  .note{font-size:15px}
  .dialog{font-size:16px}
  .dialog .cn{font-size:14.5px}
  .q{font-size:16.5px}
  .opts span,.opt-btn{font-size:15px}

<body>
<div class="topbar" id="topbar">
<header class="top">
  <button class="back" id="backBtn" style="visibility:hidden">‹ 返回</button>
  <h1 id="title">日本語上手</h1>
  <div class="langbar" id="langbar">
    <button data-lang="cn">中文</button>
    <button data-lang="en">EN</button>
  </div>
  <button class="toggle-all" id="topAction" style="display:none"></button>
</header>
<div class="modewrap">
  <div class="levelbar" id="levelbar">
    <button data-lv="n3">N3</button>
    <button data-lv="n2">N2</button>
  </div>
  <div class="typebar" id="typebar">
    <button data-ty="grammar">📘 <span class="lbl" data-cn="语法" data-en="Grammar">语法</span></button>
    <button data-ty="vocab">📗 <span class="lbl" data-cn="词汇" data-en="Vocabulary">词汇</span></button>
    <button data-ty="kanji">📙 <span class="lbl" data-cn="汉字" data-en="Kanji">汉字</span></button>
  </div>
</div>
</div>
<main id="app"></main>
<nav class="bottom">
  <button data-nav="home"><span class="ic">📚</span><span class="lbl" data-cn="周目录" data-en="Weeks">周目录</span></button>
  <button data-nav="search"><span class="ic">🔍</span><span class="lbl" data-cn="搜索" data-en="Search">搜索</span></button>
  <button data-nav="cards"><span class="ic">🗂️</span><span class="lbl" data-cn="记忆卡" data-en="Flashcards">记忆卡</span></button>
  <button data-nav="favs"><span class="ic">⭐</span><span class="lbl" data-cn="收藏" data-en="Favorites">收藏</span></button>
  <button data-nav="mistakes"><span class="ic">📝</span><span class="lbl" data-cn="错题本" data-en="Notes">错题本</span></button>
</nav>
<script>
let DATA={}, G={weeks:[]}, V={weeks:[]}, K={weeks:[]}, G2={weeks:[]}, V2={weeks:[]}, K2={weeks:[]}, dataLoaded=false, n2Loaded=false;
let MODULE = 'grammar';
try{ const m=localStorage.getItem('module'); if(['vocab','grammar','n2grammar','kanji','n2vocab','n2kanji'].includes(m)) MODULE=m; }catch(e){}
let lastVisit={};
try{ lastVisit=JSON.parse(localStorage.getItem('lastVisit')||'{}')||{}; }catch(e){ lastVisit={}; }
function entryHash(mod){ return lastVisit[mod] || '#/'; }
function saveLastVisit(hash){
  lastVisit[MODULE] = hash;
  try{ localStorage.setItem('lastVisit', JSON.stringify(lastVisit)); }catch(e){}
}
let LANG = 'cn';
try{ const l=localStorage.getItem('lang'); if(l==='en'||l==='cn') LANG=l; }catch(e){}
const LX = (cn,en)=> (LANG==='en' && en) ? en : (cn||'');
const CUR = ()=> ({vocab:V, n2grammar:G2, kanji:K, n2vocab:V2, n2kanji:K2}[MODULE]) || G;
const isGram = ()=> MODULE==='grammar'||MODULE==='n2grammar';
const MODLABELS = {grammar:['N3 语法','N3 Grammar'], n2grammar:['N2 语法','N2 Grammar'], vocab:['N3 词汇','N3 Vocabulary'], kanji:['N3 汉字','N3 Kanji'], n2vocab:['N2 词汇','N2 Vocabulary'], n2kanji:['N2 汉字','N2 Kanji']};
const modLabel = ()=> LX(...MODLABELS[MODULE]);

const $ = s=>document.querySelector(s);
const app=$('#app'), titleEl=$('#title'), backBtn=$('#backBtn'), topAction=$('#topAction');
const esc = s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s=>esc(s).replace(/~([^~]+)~/g,'<del>$1</del>');
const R = (o,f)=>(o&&o[f+'_r'])||esc(o?o[f]:'');
try{ if(localStorage.getItem('noruby')==='1') document.body.classList.add('no-ruby'); }catch(e){}
try{ if(localStorage.getItem('hidejp')==='1') document.body.classList.add('hide-jp'); }catch(e){}
try{ if(localStorage.getItem('hidecn')==='1') document.body.classList.add('hide-cn'); }catch(e){}
function rubyBtnText(){ return document.body.classList.contains('no-ruby')?'注音：关':'注音：开'; }
topAction.onclick = ()=>{
  document.body.classList.toggle('no-ruby');
  try{ localStorage.setItem('noruby', document.body.classList.contains('no-ruby')?'1':'0'); }catch(e){}
  topAction.textContent = rubyBtnText();
  syncMemBar();
};
function memBarHTML(){
  const on=(cls)=>document.body.classList.contains(cls)?'on':'';
  return `<div class="mem-bar">
    <button data-memtoggle="ruby" class="${document.body.classList.contains('no-ruby')?'':'on'}">读音</button>
    <button data-memtoggle="jp" class="${on('hide-jp')?'':'on'}">汉字</button>
    <button data-memtoggle="cn" class="${on('hide-cn')?'':'on'}">翻译</button>
  </div>`;
}
function syncMemBar(){
  const bar=document.querySelector('.mem-bar'); if(!bar) return;
  const btns=bar.querySelectorAll('button');
  btns[0].classList.toggle('on', !document.body.classList.contains('no-ruby'));
  btns[1].classList.toggle('on', !document.body.classList.contains('hide-jp'));
  btns[2].classList.toggle('on', !document.body.classList.contains('hide-cn'));
}
function noteClass(t){ return (t==='ダメ')?'note dame':'note'; }
function noteLabel(t){ return ({'れい':'れい','ダメ':'ダメ✗','OK':'OK','もっと':'もっと!','tag':'💬','!':'注意','◆':'◆'})[t]||t; }

/* ---- TTS (朗读) ---- */
const escAttr = s=>esc(s).replace(/"/g,'&quot;');
let jaVoice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices()||[]; jaVoice=vs.find(v=>/^ja/i.test(v.lang))||vs.find(v=>/japan/i.test(v.name))||null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function say(t){ try{ if(!('speechSynthesis' in window)||!t) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.9; if(jaVoice)u.voice=jaVoice; speechSynthesis.speak(u); }catch(e){} }
function sayBtn(t){ return t?`<button class="sayb" data-say="${escAttr(t)}" aria-label="朗读">🔊</button>`:''; }

/* ---- 收藏 (生词本) ---- 本地 localStorage 即时可用，同时后台与 /api/favorites (Cloudflare KV) 同步实现跨设备 */
/* ---------- 错题/生词本 (自己录入的错题、忘记的单词/语法，纯本地存储) ---------- */
let MISTAKES=[]; try{ MISTAKES=JSON.parse(localStorage.getItem('mistakes')||'[]')||[]; }catch(e){ MISTAKES=[]; }
let mistakeAddType='q';
const MISTAKE_TYPES={q:'错题', word:'单词', grammar:'语法'};
let _mistakeSyncing=false, _mistakePushTimer=null;
function pushMistakesNow(){
  fetch('/api/mistakes', {method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify(MISTAKES)}).catch(()=>{});
}
function saveMistakes(){
  try{ localStorage.setItem('mistakes', JSON.stringify(MISTAKES)); }catch(e){}
  if(_mistakeSyncing) return; // 刚从服务器拉取时不要把同一份数据立刻推回去
  clearTimeout(_mistakePushTimer);
  _mistakePushTimer = setTimeout(pushMistakesNow, 400);
}
async function pullMistakesFromServer(){
  try{
    const res = await fetch('/api/mistakes', {cache:'no-store'});
    if(!res.ok) return;
    const data = await res.json();
    if(Array.isArray(data)){
      _mistakeSyncing = true;
      MISTAKES = data;
      try{ localStorage.setItem('mistakes', JSON.stringify(MISTAKES)); }catch(e){}
      _mistakeSyncing = false;
      render();
    }
  }catch(e){ /* 离线或本地 file:// 打开时静默失败，继续用本地缓存 */ }
}
function addMistake(type, text){
  text=(text||'').trim(); if(!text) return;
  MISTAKES.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2,7), type, text, ts:Date.now()});
  saveMistakes();
}
function deleteMistake(id){ MISTAKES=MISTAKES.filter(m=>m.id!==id); saveMistakes(); }
function mistakeDate(ts){
  const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function mistakeItemHTML(m){
  return `<div class="mistake-item">
    <div class="mistake-item-head"><span class="mtag mt-${m.type}">${MISTAKE_TYPES[m.type]||m.type}</span><span class="mistake-date">${mistakeDate(m.ts)}</span><button class="mistake-del" data-mistake-del="${escAttr(m.id)}" aria-label="删除">✕</button></div>
    <div class="mistake-text">${esc(m.text).replace(/\n/g,'<br>')}</div>
  </div>`;
}
let mistakeFilter='all';
function viewMistakes(){
  setNav('mistakes'); setHeader(LX('错题 / 生词本','My Mistakes & Notes'), false);
  const list = mistakeFilter==='all' ? MISTAKES : MISTAKES.filter(m=>m.type===mistakeFilter);
  const filterBar = `<div class="fc-filter" style="margin-bottom:14px">
    <button class="${mistakeFilter==='all'?'on':''}" data-mfilter="all">全部（${MISTAKES.length}）</button>
    ${Object.entries(MISTAKE_TYPES).map(([k,v])=>`<button class="${mistakeFilter===k?'on':''}" data-mfilter="${k}">${v}（${MISTAKES.filter(m=>m.type===k).length}）</button>`).join('')}
  </div>`;
  const body = list.length ? list.map(mistakeItemHTML).join('') : '<div class="empty">还没有记录，在上面写一条保存试试。</div>';
  app.innerHTML = `<div class="card mistake-widget" style="margin-bottom:14px">
    <div class="mistake-types" id="mistakeTypes">${Object.entries(MISTAKE_TYPES).map(([k,v])=>`<button class="${k===mistakeAddType?'on':''}" data-mtype="${k}">${v}</button>`).join('')}</div>
    <textarea id="mistakeInput" class="mistake-input" rows="2" placeholder="记一下考试错题、老是记不住的单词或语法点……"></textarea>
    <button class="primary" data-mistake-add>保存</button>
  </div>${filterBar}${body}`;
}
let FAV={}; try{ FAV=JSON.parse(localStorage.getItem('favs')||'{}')||{}; }catch(e){ FAV={}; }
const FAVMETA={};
let _favSyncing=false, _favPushTimer=null;
function pushFavsNow(){
  fetch('/api/favorites', {method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify(FAV)}).catch(()=>{});
}
function saveFav(){
  try{ localStorage.setItem('favs', JSON.stringify(FAV)); }catch(e){}
  if(_favSyncing) return; // 刚从服务器拉取时不要把同一份数据立刻推回去
  clearTimeout(_favPushTimer);
  _favPushTimer = setTimeout(pushFavsNow, 400);
}
async function pullFavsFromServer(){
  try{
    const res = await fetch('/api/favorites', {cache:'no-store'});
    if(!res.ok) return;
    const data = await res.json();
    if(data && typeof data==='object' && !Array.isArray(data)){
      _favSyncing = true;
      FAV = data;
      try{ localStorage.setItem('favs', JSON.stringify(FAV)); }catch(e){}
      _favSyncing = false;
      render();
    }
  }catch(e){ /* 离线或本地 file:// 打开时静默失败，继续用本地缓存 */ }
}
function isFav(id){ return !!FAV[id]; }
function toggleFav(id){ if(FAV[id]) delete FAV[id]; else if(FAVMETA[id]) FAV[id]=FAVMETA[id]; saveFav(); }
function star(id, snap){ FAVMETA[id]=snap; return `<button class="starb" data-fav="${escAttr(id)}" aria-label="收藏">${isFav(id)?'★':'☆'}</button>`; }

/* ---------- module switch ---------- */
let LEVEL='n3', TYPE='grammar';
const MOD2LT = {grammar:['n3','grammar'], vocab:['n3','vocab'], kanji:['n3','kanji'], n2grammar:['n2','grammar'], n2vocab:['n2','vocab'], n2kanji:['n2','kanji']};
const LT2MOD = {'n3:grammar':'grammar', 'n3:vocab':'vocab', 'n3:kanji':'kanji', 'n2:grammar':'n2grammar', 'n2:vocab':'n2vocab', 'n2:kanji':'n2kanji'};
function deriveLT(){ const p=MOD2LT[MODULE]||['n3','grammar']; LEVEL=p[0]; TYPE=p[1]; }
deriveLT();
function moduleFrom(lv,ty){ return LT2MOD[lv+':'+ty] || 'grammar'; }
function syncModeBar(){
  deriveLT();
  document.querySelectorAll('#levelbar button').forEach(b=>b.classList.toggle('on', b.dataset.lv===LEVEL));
  document.querySelectorAll('#typebar button').forEach(b=>b.classList.toggle('on', b.dataset.ty===TYPE));
  document.querySelectorAll('#langbar button').forEach(b=>b.classList.toggle('on', b.dataset.lang===LANG));
  document.querySelectorAll('.lbl[data-cn]').forEach(el=>{ el.textContent = LX(el.dataset.cn, el.dataset.en); });
}
function setModule(m){
  MODULE=m; try{ localStorage.setItem('module',m); }catch(e){}
  fc.deck=[]; fc.week=0; syncModeBar();
}
document.querySelectorAll('#levelbar button').forEach(b=>{
  b.onclick=()=>{ const lv=b.dataset.lv; const mod=moduleFrom(lv, TYPE); setModule(mod); navTo(entryHash(mod)); };
});
document.querySelectorAll('#typebar button').forEach(b=>{
  b.onclick=()=>{ const mod=moduleFrom(LEVEL, b.dataset.ty); setModule(mod); navTo(entryHash(mod)); };
});
document.querySelectorAll('#langbar button').forEach(b=>{
  b.onclick=()=>{ LANG=b.dataset.lang; try{localStorage.setItem('lang',LANG);}catch(e){} syncModeBar(); render(); };
});

/* ---------- routing ---------- */
function navTo(hash){ if(location.hash===hash) render(); else location.hash=hash; }
window.addEventListener('hashchange', render);
backBtn.onclick = ()=>{ history.length>1 ? history.back() : navTo('#/'); };
document.querySelectorAll('nav.bottom button').forEach(b=>{
  b.onclick = ()=> navTo({home:'#/',search:'#/search',cards:'#/cards',favs:'#/favs',mistakes:'#/mistakes'}[b.dataset.nav]);
});
/* delegated clicks (artifact CSP blocks inline onclick=) */
app.addEventListener('click', e=>{
  const mt=e.target.closest('[data-memtoggle]'); if(mt){
    const kind=mt.dataset.memtoggle;
    if(kind==='ruby'){ document.body.classList.toggle('no-ruby'); try{localStorage.setItem('noruby', document.body.classList.contains('no-ruby')?'1':'0');}catch(e){} topAction.textContent=rubyBtnText(); }
    else if(kind==='jp'){ document.body.classList.toggle('hide-jp'); try{localStorage.setItem('hidejp', document.body.classList.contains('hide-jp')?'1':'0');}catch(e){} }
    else if(kind==='cn'){ document.body.classList.toggle('hide-cn'); try{localStorage.setItem('hidecn', document.body.classList.contains('hide-cn')?'1':'0');}catch(e){} }
    syncMemBar();
    return;
  }
  const ob=e.target.closest('.opt-btn'); if(ob){
    const wrap=ob.closest('.qz');
    if(wrap && !wrap.classList.contains('answered')){
      const correct=+wrap.dataset.qcorrect, picked=+ob.dataset.optidx;
      wrap.classList.add('answered');
      wrap.querySelectorAll('.opt-btn').forEach(b=>{
        const idx=+b.dataset.optidx;
        if(idx===correct) b.classList.add('correct');
        else if(idx===picked) b.classList.add('wrong');
      });
      const qEl=wrap.closest('.q');
      if(qEl){
        const r=qEl.querySelector('.qz-result'); if(r) r.textContent = picked===correct?'✓ 答对了':'✗ 答错了';
        if(r) r.classList.add(picked===correct?'ok':'ng');
        const note=qEl.querySelector('.qz-note'); if(note) note.classList.add('show');
      }
    }
    return;
  }
  const sc=e.target.closest('[data-scroll]'); if(sc){ const el=document.getElementById(sc.dataset.scroll); if(el) el.scrollIntoView({behavior:sc.classList.contains('wk-tocitem')?'auto':'smooth',block:'start'}); return; }
  const sb=e.target.closest('[data-say]'); if(sb){ say(sb.dataset.say); return; }
  const fv=e.target.closest('[data-fav]'); if(fv){ toggleFav(fv.dataset.fav); fv.textContent=isFav(fv.dataset.fav)?'★':'☆'; if((location.hash||'#/')==='#/favs') viewFavs(); return; }
  if(e.target.closest('[data-favfc]')){ startFavFc(); return; }
  const ffl=e.target.closest('[data-favfilter]'); if(ffl){ favFilter=ffl.dataset.favfilter; viewFavs(); return; }
  const cm=e.target.closest('[data-ctmode]'); if(cm){ ctMode=cm.dataset.ctmode; viewContrast(); return; }
  const cw=e.target.closest('[data-ctweek]'); if(cw){ ctWeek=+cw.dataset.ctweek; viewContrast(); return; }
  const mty=e.target.closest('[data-mtype]'); if(mty){ mistakeAddType=mty.dataset.mtype; document.querySelectorAll('#mistakeTypes button').forEach(b=>b.classList.toggle('on', b.dataset.mtype===mistakeAddType)); return; }
  if(e.target.closest('[data-mistake-add]')){ const ta=document.getElementById('mistakeInput'); if(ta && ta.value.trim()){ addMistake(mistakeAddType, ta.value); render(); } return; }
  const md=e.target.closest('[data-mistake-del]'); if(md){ deleteMistake(md.dataset.mistakeDel); render(); return; }
  const mf=e.target.closest('[data-mfilter]'); if(mf){ mistakeFilter=mf.dataset.mfilter; viewMistakes(); return; }
  const fclr=e.target.closest('[data-favclear]'); if(fclr){ if(fclr.dataset.armed){ FAV={}; saveFav(); viewFavs(); } else { fclr.dataset.armed='1'; fclr.textContent='再点一次清空'; } return; }
  if(e.target.closest('[data-favflip]')){ favFlip=!favFlip; renderFavFc(); return; }
  if(e.target.closest('[data-favprev]')){ if(favIdx>0){ favIdx--; favFlip=false; renderFavFc(); } return; }
  if(e.target.closest('[data-favnext]')){ favIdx=(favIdx+1)%favDeck.length; favFlip=false; renderFavFc(); return; }
  if(e.target.closest('[data-favback]')){ navTo('#/favs'); return; }
  const go=e.target.closest('[data-go]'); if(go){ if(go.dataset.mod) setModule(go.dataset.mod); navTo(go.dataset.go); return; }
  const an=e.target.closest('[data-ans]'); if(an){ const a=document.getElementById(an.dataset.ans); if(a){ a.classList.toggle('show'); an.textContent=a.classList.contains('show')?'隐藏答案':'显示答案'; } return; }
  const hit=e.target.closest('[data-hit]'); if(hit){ openHit(+hit.dataset.hit); return; }
  const hq=e.target.closest('[data-histq]'); if(hq){ const qi=$('#q'); if(qi){ qi.value=hq.dataset.histq; qi.oninput(); } return; }
  const hc=e.target.closest('[data-histclear]'); if(hc){ clearSearchHistory(); const qi=$('#q'); if(qi){ qi.value=''; qi.oninput(); } return; }
  const fw=e.target.closest('[data-fcweek]'); if(fw){ fcSetWeek(+fw.dataset.fcweek); return; }
  const fb=e.target.closest('[data-fc]'); if(fb){ ({prev:fcPrev,next:fcNext,shuffle:fcShuffle})[fb.dataset.fc](); return; }
  if(e.target.closest('[data-fcflip]')){ fcFlip(); return; }
});
function setNav(name){ document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('on', b.dataset.nav===name)); }
function setHeader(t, showBack){
  titleEl.textContent = t;
  backBtn.style.visibility = showBack?'visible':'hidden';
  topAction.style.display='inline-block'; topAction.textContent = rubyBtnText();
}
function updateStickyVars(){
  const tb = document.getElementById('topbar');
  if(tb) document.documentElement.style.setProperty('--topbarh', tb.offsetHeight+'px');
  const ht = document.querySelector('.home-top');
  document.documentElement.style.setProperty('--hometoph', (ht?ht.offsetHeight:0)+'px');
}
window.addEventListener('resize', updateStickyVars);
function render(){
  if(!dataLoaded){ app.innerHTML='<div class="empty">加载中…</div>'; return; }
  const h = location.hash || '#/';
  if((MODULE==='n2grammar'||MODULE==='n2vocab'||MODULE==='n2kanji') && !n2Loaded){ setNav('home'); setHeader(modLabel(), false); app.innerHTML='<div class="empty">N2 数据加载中，请稍候…</div>'; return; }
  if(h==='#/search' && !n2Loaded){ setNav('search'); setHeader(LX('搜索（语法 + 词汇）','Search (Grammar + Vocabulary)'), false); app.innerHTML='<div class="empty">词典数据加载中，马上就好…</div>'; return; }
  syncModeBar();
  window.scrollTo(0,0);
  if(h==='#/'){ saveLastVisit('#/'); viewHome(); }
  else if(h==='#/search') viewSearch();
  else if(h==='#/cards') viewCards();
  else if(h==='#/favs') viewFavs();
  else if(h==='#/ref'){ if(MODULE!=='grammar') setModule('grammar'); viewRef(); }
  else if(h==='#/contrast'){ if(MODULE!=='grammar') setModule('grammar'); viewContrast(); }
  else if(h==='#/katsuyou'){ if(MODULE!=='grammar') setModule('grammar'); viewKatsuyou(); }
  else if(h==='#/mistakes') viewMistakes();
  else {
    let m = h.match(/^#\/day\/(\d)-(\d)(?:\/(p\d+|v\d+-\d+|k\d+))?$/);
    if(m){
      saveLastVisit(`#/day/${m[1]}-${m[2]}`);
      viewDay(+m[1], +m[2], m[3]||null);
    }
    else viewHome();
  }
  updateStickyVars();
}

/* ---------- home ---------- */
function viewHome(){
  setNav('home'); setHeader(modLabel(), false);
  const book = LX(
    {grammar:'考前对策 N3语法', n2grammar:'考前对策 N2语法', vocab:'考前对策 N3词汇', kanji:'考前对策 N3汉字', n2vocab:'考前对策 N2词汇', n2kanji:'考前对策 N2汉字'}[MODULE],
    {grammar:'JLPT Prep N3 Grammar', n2grammar:'JLPT Prep N2 Grammar', vocab:'JLPT Prep N3 Vocabulary', kanji:'JLPT Prep N3 Kanji', n2vocab:'JLPT Prep N2 Vocabulary', n2kanji:'JLPT Prep N2 Kanji'}[MODULE]
  );
  const kind = LX(

  </div>`;
  for(const w of weeks){
    const wt = w.title ? ` <span class="jp">${esc(w.title)}</span>` : '';
    const wsubText = LX(w.title_cn, w.title_en);
    const wsub = wsubText ? `<div class="sub">${esc(wsubText)}</div>` : '';
    html += `<div class="card week-card" id="wk-${w.n}"><h2>第${w.n}週${wt}</h2>${wsub}<div class="day-list">` +

  }
  app.innerHTML = html;
}

/* ---------- shared helpers ---------- */
function findDay(w,d){ const wk=CUR().weeks.find(x=>x.n===w); return wk?wk.days.find(x=>x.day===d):null; }
function ansBlock(id, content){
  return `<button class="ansbtn" data-ans="${id}">显示答案</button>
  <div class="answer" id="${id}">${content}</div>`;
}
function afterRender(scrollP){
  if(scrollP!=null){
    const el=document.querySelector(`[id$="-${scrollP}"].point`);
    if(el){ el.scrollIntoView({block:'center'}); el.style.background='var(--amber-soft)'; setTimeout(()=>el.style.background='',1600); }
  }
}
const CIRCLED_NUMS = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚㉛㉜㉝㉞㉟';
function parseCircledAnswers(str){
  const map={};
  if(!str) return map;
  let i=0;
  while(i<str.length){
    const ci = CIRCLED_NUMS.indexOf(str[i]);
    if(ci>=0){
      let j=i+1, num='';
      while(j<str.length && /[0-9]/.test(str[j])){ num+=str[j]; j++; }
      if(num) map[ci+1]=+num;
      i=j;
    } else i++;
  }
  return map;
}
function quizOptsHTML(it, correctAns){
  const opts = it.opts_r||(it.opts||[]).map(esc);
  if(!it.opts) return '';
  if(correctAns==null) return `<div class="opts">${opts.map((o,i)=>`<span class="jp">${i+1} ${o}</span>`).join('')}</div>`;
  return `<div class="opts qz" data-qcorrect="${correctAns}">${opts.map((o,i)=>`<button type="button" class="opt-btn jp" data-optidx="${i+1}">${i+1} ${o}</button>`).join('')}</div>`;
}
function optsRow(it){
  const opts = it.options_r||it.opts_r||(it.options||it.opts||[]).map(esc);
  if(!(it.options||it.opts)) return '';
  const numbered = !!it.opts; // exam-style opts are numbered
  return `<div class="opts">${opts.map((o,i)=>`<span class="jp">${numbered?(i+1)+' ':''}${o}</span>`).join('')}</div>`;
}

/* ---------- search (cross-module) ---------- */
let searchIndex=null;
function buildIndex(){
  if(searchIndex) return searchIndex;
  searchIndex=[];
  const pushG = (mod, weeks)=>{ for(const w of weeks) for(const d of w.days) (d.points||[]).forEach((p,i)=>{
    searchIndex.push({module:mod, w:w.n,d:d.day,i, key:p.pattern||'', reading:p.reading||'',
      extra:((p.connection||'').replace(/~/g,''))+' '+(p.usage_jp||'')+' '+(p.usage_cn||'')+' '+(p.examples||[]).map(e=>e.jp+' '+(e.cn||'')).join(' '),
      sub:p.usage_cn||'', dayTitle:d.title});
  }); };
  pushG('grammar', G.weeks);
  pushG('n2grammar', G2.weeks);
  const pushV = (mod, weeks)=>{ for(const w of weeks) for(const d of w.days) (d.sections||[]).forEach((sec,si)=>(sec.items||[]).forEach((it,ii)=>{
    searchIndex.push({module:mod, w:w.n,d:d.day, si, ii, key:it.jp||'', reading:'',
      extra:(it.en||'')+' '+(it.cn||'')+' '+(it.rel||''), sub:[it.cn,it.en].filter(Boolean).join(' · '), dayTitle:d.title});
  })); };
  pushV('vocab', V.weeks);
  pushV('n2vocab', V2.weeks);
  const pushK = (mod, weeks)=>{ for(const w of weeks) for(const d of w.days) (d.kanji||[]).forEach((k,ki)=>(k.words||[]).forEach(wd=>{
    searchIndex.push({module:mod, w:w.n,d:d.day, ki, key:wd.jp||'', reading:wd.reading||'',
      extra:(wd.en||'')+' '+(wd.cn||'')+' '+(k.char||''), sub:[wd.cn,wd.en].filter(Boolean).join(' · '), dayTitle:d.title});
  })); };
  pushK('kanji', K.weeks);
  pushK('n2kanji', K2.weeks);
  return searchIndex;
}
const SEARCH_HIST_KEY='searchHistory', SEARCH_HIST_MAX=15;
function getSearchHistory(){ try{ return JSON.parse(localStorage.getItem(SEARCH_HIST_KEY)||'[]'); }catch(e){ return []; } }
function saveSearchHistory(kw){
  if(!kw) return;
  try{
    let h=getSearchHistory().filter(x=>x!==kw);
    h.unshift(kw);
    localStorage.setItem(SEARCH_HIST_KEY, JSON.stringify(h.slice(0,SEARCH_HIST_MAX)));
  }catch(e){}
}
function clearSearchHistory(){ try{ localStorage.removeItem(SEARCH_HIST_KEY); }catch(e){} }
let lastSearchKw='';
function viewSearch(){
  setNav('search'); setHeader(LX('搜索（语法 + 词汇）','Search (Grammar + Vocabulary)'), false);

  const q=$('#q'), res=$('#results'); q.focus();

    }
    const lk=kw.toLowerCase();
    const hits=buildIndex().filter(e=> e.key.toLowerCase().includes(lk)||e.reading.includes(kw)||e.extra.toLowerCase().includes(lk)).slice(0,60);
    if(!hits.length){ res.innerHTML='<div class="empty">没有找到，换个关键词试试</div>'; return; }
    const mark=s=>{ const t=esc(s); if(!kw) return t; try{ return t.split(esc(kw)).join(`<span class="hl">${esc(kw)}</span>`);}catch(e){return t;} };
    res.innerHTML = hits.map((e,ix)=>{
      const tag = {grammar:'<span class="mtag g">N3语法</span>', n2grammar:'<span class="mtag g2">N2语法</span>', vocab:'<span class="mtag v">N3词汇</span>', kanji:'<span class="mtag k">N3汉字</span>', n2vocab:'<span class="mtag v2">N2词汇</span>', n2kanji:'<span class="mtag k2">N2汉字</span>'}[e.module];
      window['__hit'+ix]=e;

      </div>`;

  };

window.openHit = ix=>{

/* ---------- flashcards (per module) ---------- */
let fc={week:0, deck:[], idx:0, flipped:false};
function buildDeck(week){
  const deck=[];
  if(isGram()){
    for(const w of CUR().weeks){ if(week&&w.n!==week) continue; for(const d of w.days) (d.points||[]).forEach((p,i)=>deck.push({w:w.n,d:d.day,i,p})); }
  } else if(MODULE==='kanji'||MODULE==='n2kanji'){
    for(const w of CUR().weeks){ if(week&&w.n!==week) continue; for(const d of w.days) (d.kanji||[]).forEach(k=>{ if(k.words&&k.words.length) deck.push({k}); }); }
  } else {
    for(const w of CUR().weeks){ if(week&&w.n!==week) continue; for(const d of w.days) (d.sections||[]).forEach(sec=>(sec.items||[]).forEach(it=>{ if(it.jp&&(it.cn||it.en)) deck.push({v:it}); })); }
  }
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  return deck;
}

    else{ const p=cur.p; cardHTML=`<div class="fcard" data-fcflip="1"><div class="backside">
      <div class="jp" style="font-weight:700;font-size:18px">${R(p,'pattern')}</div>

  app.innerHTML = `<div class="fc-wrap"><div class="fc-filter">${filt}</div>

    if(V3.note) html += `<div class="note"><span class="jp">${esc(V3.note)}</span></div>`;
    if(V3.callout){
      const c=V3.callout;
      html += `<div class="ct-tip" style="margin-top:14px">💡 ${esc(c.title)}</div>`;
      html += (c.chains||[]).map(ch=>`<div class="jp" style="margin:4px 0"><span style="color:var(--sub)">${esc(ch[0])}</span> → <span style="color:var(--sub)">${esc(ch[1])}</span> → <span style="color:var(--accent);font-weight:600">${esc(ch[2])}</span></div>`).join('');
      if(c.suppletiveNote) html += `<div class="meta" style="margin-top:10px">${esc(c.suppletiveNote)}</div>`;
      html += `<div class="opts">` + (c.suppletive||[]).map(p=>`<span class="jp">${esc(p[0])} → <b style="color:var(--accent)">${esc(p[1])}</b></span>`).join('') + `</div>`;
      if(c.tip) html += `<div class="note" style="margin-top:8px"><span class="jp">${esc(c.tip)}</span></div>`;
    }
    html += `</div>`;
  }
  if(K2.footer) html += `<div class="meta" style="margin-top:10px">${esc(K2.footer)}</div>`;
  app.innerHTML = html;
}

const DATA_FILES = __DATA_FILES__;
async function bootN3(){
  try{
    const names=['grammar','vocab','kanji'];
    const [g,v,k]=await Promise.all(names.map(n=>fetch('data/'+DATA_FILES[n]).then(r=>r.json())));
    G=g; V=v; K=k;
    DATA.grammar=G; DATA.vocab=V; DATA.kanji=K;
    dataLoaded=true;
  }catch(e){ app.innerHTML='<div class="empty">数据加载失败，请检查网络后刷新重试。</div>'; return; }
  render();
  bootN2(); // N3 优先，N2 随后低优先级加载
}
async function bootN2(){
  try{
    const names=['n2grammar','n2vocab','n2kanji'];
    const [g2,v2,k2]=await Promise.all(names.map(n=>fetch('data/'+DATA_FILES[n]).then(r=>r.json())));
    G2=g2; V2=v2; K2=k2;
    DATA.n2grammar=G2; DATA.n2vocab=V2; DATA.n2kanji=K2;
    n2Loaded=true;
    searchIndex=null; // N2 数据到位后让搜索索引下次重新构建，纳入N2结果
    const h=location.hash||'#/';
    if(MODULE==='n2grammar'||MODULE==='n2vocab'||MODULE==='n2kanji'||h==='#/search') render();
  }catch(e){ /* N2 加载失败时静默：N3 内容不受影响，用户切到N2或搜索时会看到持续的加载提示 */ }
}
render();
bootN3();
pullFavsFromServer();
pullMistakesFromServer();
</script>
