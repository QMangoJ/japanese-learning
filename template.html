<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>日本語上手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#22272e; --sub:#6a737d; --line:#e3e6ea;
  --accent:#c0392b; --accent-soft:#fdf0ee; --blue:#2b6cb0; --blue-soft:#ebf3fb;
  --green:#2f855a; --green-soft:#ecf7f0; --amber:#b7791f; --amber-soft:#fdf6e9;
  --red:#c0392b; --red-soft:#fdecea;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04); --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171c; --card:#1e232a; --ink:#e6e9ed; --sub:#98a1ab; --line:#313842;
    --accent:#e57365; --accent-soft:#33231f; --blue:#6ea8dc; --blue-soft:#1e2a38;
    --green:#7cc39a; --green-soft:#1d2c24; --amber:#d9a557; --amber-soft:#2e2718;
    --red:#e57373; --red-soft:#3a2323;
    --shadow:0 1px 3px rgba(0,0,0,.4);}
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{margin:0;padding:0;max-width:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans","Hiragino Kaku Gothic ProN","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:16px;line-height:1.65;padding-bottom:calc(64px + env(safe-area-inset-bottom));overflow-wrap:break-word}
.jp{font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP","PingFang SC",sans-serif}
.topbar{position:sticky;top:0;z-index:20}
header.top{background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
header.top .back{border:none;background:none;color:var(--blue);font-size:15px;padding:4px 2px;cursor:pointer;flex:none}
header.top h1{font-size:16px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 级别收成标题栏里的一个胶囊：换级别是低频操作，点开弹层选；
   类型（语法/单词/汉字）是高频操作，保持常驻一排、点一下就切。 */
.lvchip{flex:none;display:flex;align-items:center;gap:4px;border:1px solid var(--blue);background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:800;letter-spacing:.5px;cursor:pointer;min-height:32px}
.lvchip .cv{font-size:10px;opacity:.7}
.modewrap{background:var(--card);border-bottom:1px solid var(--line)}
.typebar{display:flex;gap:6px;justify-content:center;padding:8px 14px}
.typebar button{flex:1;max-width:170px;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:999px;padding:6px 0;font-size:14px;font-weight:700;cursor:pointer}
.langbar{display:flex;gap:4px;flex:none}
.langbar button{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer}
.langbar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.typebar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* 通用底部弹层：级别选择和「通用知识」共用这一套 */
.sheet-mask{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.42)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);
  padding:8px 14px calc(14px + env(safe-area-inset-bottom));max-height:76vh;overflow-y:auto}
.sheet-grip{width:36px;height:4px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.sheet-h{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:700;margin-bottom:10px}
.sheet-h .sub{font-size:12px;font-weight:400;color:var(--sub)}
.sheet-row{display:flex;gap:8px;margin-bottom:8px}
.sheet-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 6px;cursor:pointer;color:var(--ink);font-size:13.5px;min-height:60px;justify-content:center}
.sheet-item .ic{font-size:20px;line-height:1}
.sheet-item .sub{font-size:11px;color:var(--sub)}
.sheet-item.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}
.sheet-item.scoped{border-style:dashed}
/* 侧栏只在桌面出现：手机上这些入口在底栏和「通用」弹层里，
   桌面有横向空间，就按 UI 稿把它们摊平成一列常驻目录，不用再点开弹层。 */
.side{display:none}
.side-brand{font-size:15px;font-weight:800;padding:2px 8px 0}
.side-sec{display:flex;flex-direction:column;gap:2px}
.side-h{font-size:10.5px;letter-spacing:.1em;color:var(--sub);padding:0 8px 4px;display:flex;align-items:baseline;gap:6px}
.side-h .n{letter-spacing:0;text-transform:none}
.side-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border:1px solid var(--line);border-radius:9px;padding:3px}
.side-seg button{border:none;background:none;color:var(--sub);border-radius:6px;padding:5px 0;font-size:13px;font-weight:800;cursor:pointer}
.side-seg button.on{background:var(--blue);color:#fff}
.side-item{display:flex;align-items:center;gap:8px;border:none;background:none;color:var(--ink);font-size:13.5px;
  padding:7px 8px;border-radius:7px;cursor:pointer;text-align:left;width:100%;min-height:34px}
.side-item .ic{flex:none;width:17px;text-align:center}
.side-item .ct{margin-left:auto;font-size:11px;color:var(--sub);flex:none}
.side-item:hover{background:var(--bg)}
.side-item.on{background:var(--blue-soft);color:var(--blue);font-weight:700}
.side-item.on .ct{color:var(--blue)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--line)}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.week-card{cursor:pointer;padding:0}
/* 周做成手风琴：默认只展开上次看的那一周，其余收起，一屏能看全 */
.wk-head{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer}
.wk-t{flex:1;min-width:0}
.wk-head h2{margin:0;font-size:17px;line-height:1.35}
.wk-head .sub{color:var(--sub);font-size:12.5px;line-height:1.4}
.wk-head .cnt{font-size:12px;color:var(--sub);flex:none;white-space:nowrap}
.wk-head .cv{flex:none;font-size:12px;color:var(--sub);width:12px;text-align:center}
.wk-body{padding:0 16px 14px}
.week-card h2{margin:0 0 2px;font-size:18px}
.week-card .sub{color:var(--sub);font-size:13px}
/* 天的行里预览当天内容，不用点进去就知道这天讲什么 */
.day-prev{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.day-prev .dp{font-size:11.5px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.day-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}
.day-item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--bg)}
.day-item:active{transform:scale(.98)}
.day-item .d{font-size:12px;color:var(--accent);font-weight:700}
.day-item .t{font-size:14px;font-weight:600}
.day-item .tc{font-size:12px;color:var(--sub)}
.dialog{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.dialog .cn{color:var(--sub);font-size:13px;margin-top:6px}
.point{margin-top:14px}
.point h3{margin:0;font-size:17.5px;background:linear-gradient(transparent 62%,var(--accent-soft) 62%);display:inline;padding:0 2px;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:2px}
.ex .jp u,.dialog u{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:2px;font-weight:600}
.point .reading{color:var(--sub);font-size:12.5px;margin:2px 0 6px}
.conn{background:var(--blue-soft);color:var(--blue);border-radius:8px;padding:7px 10px;font-size:13.5px;margin:6px 0}
.conn-label{font-size:11px;font-weight:700;letter-spacing:.08em;opacity:.75;display:block;margin-bottom:4px}
/* 一条接続里「／」是并列的候选、「＋」是前后接的连接点。原来全挤在一行文字里，
   换行还会断在分隔符上，根本看不出谁跟谁是一组，所以把候选各自框起来。 */
/* 一个候选一行就够了，不用加框——悬挂缩进让折行的部分明显还属于上一条 */
.conn-line{padding-left:14px;text-indent:-14px;line-height:1.55}
.conn-line.tail{padding-left:32px;text-indent:-18px}
.conn-grp+.conn-grp{margin-top:6px}
.conn-plus{font-weight:800;margin-right:3px}
.usage{font-size:14.5px;margin:4px 0}
.usage .cn{color:var(--accent);font-weight:600}
.ex{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0}
.ex .jp{font-size:15.5px}
.ex .eq{color:var(--sub);font-size:13px}
.ex .cn{color:var(--sub);font-size:13.5px}
.note{font-size:13.5px;margin:6px 0;padding:6px 10px;border-radius:8px;background:var(--green-soft)}
.note b.nt{color:var(--green);margin-right:6px}
.note.dame{background:var(--accent-soft)}
.note.dame b.nt{color:var(--accent)}
.sec-title{font-size:15px;font-weight:700;color:var(--accent);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.sec-title small{color:var(--sub);font-weight:400;font-size:12px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.q{margin:10px 0;font-size:15px}
.q .n{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:var(--blue-soft);color:var(--blue);border-radius:6px;font-size:12.5px;font-weight:700;margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opts span{border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:13.5px;background:var(--bg);max-width:100%;overflow-wrap:break-word}
.ansbtn{border:1px dashed var(--blue);background:none;color:var(--blue);border-radius:8px;padding:4px 12px;font-size:13.5px;cursor:pointer;margin:8px 0}
.answer{display:none;background:var(--green-soft);border-radius:8px;padding:8px 12px;font-size:14px;margin-top:6px}
.answer.show{display:block}
.opt-btn{border:1px solid var(--line);border-radius:8px;padding:3px 11px;font-size:13.5px;background:var(--bg);color:var(--ink);max-width:100%;overflow-wrap:break-word;cursor:pointer;font-family:inherit}
.opt-btn:active{transform:scale(.97)}
.qz.answered .opt-btn{cursor:default}
.qz.answered .opt-btn:active{transform:none}
.qz.answered .opt-btn.correct{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
.qz.answered .opt-btn.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red);font-weight:700}
.qz-note{display:none;background:var(--amber-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13.5px;margin-top:6px;line-height:1.6}
.qz-note.show{display:block}
/* 逐题解析：默认只露一行译文，逐项讲解/要点/生单词收在折叠里，
   不然 25 道题全展开，页面会长到没法用 */
.an-trans{margin-top:3px;color:var(--sub);font-size:13px}
.an-link{margin-top:6px;display:inline-block;border:1px solid var(--blue);color:var(--blue);
  border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700;cursor:pointer;max-width:100%}
.an-link:active{transform:scale(.98)}
.an-more{margin-top:6px}
.an-more summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--blue);list-style:none;padding:2px 0}
.an-more summary::-webkit-details-marker{display:none}
.an-more summary::before{content:'▸ '}
.an-more[open] summary::before{content:'▾ '}
.an-why{margin:4px 0 0;padding:0;list-style:none;counter-reset:anw}
.an-why li{counter-increment:anw;display:flex;gap:7px;align-items:baseline;padding:4px 0;border-top:1px solid var(--line);font-size:13px}
.an-why li::before{content:counter(anw);flex:none;width:15px;color:var(--sub);font-weight:700}
.an-why li.ok::before{color:var(--green)}
.an-why .o{flex:none;max-width:42%;overflow-wrap:break-word}
.an-why li.ok .o{color:var(--green);font-weight:700}
.an-why .w{color:var(--sub);min-width:0}
.an-point{margin-top:7px;background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:6px 9px;font-size:13px}
.an-words{margin-top:7px;display:flex;flex-direction:column;gap:1px;font-size:12.5px}
.an-h,.an-words .h{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.06em;margin-top:8px}
/* 逐节拆解：说明比生词的释义长得多，挤成一栏会碎成一堆两三字的行，
   所以改成词一行、说明另起一行铺满宽度 */
.an-parse .an-word{display:block;padding:4px 0;border-top:1px solid var(--line)}
.an-parse .j{font-weight:700}
.an-parse .k{color:var(--sub);font-size:11.5px;margin-left:6px}
.an-parse .m{display:block;color:var(--sub);margin-top:1px}
/* 层层叠加：每一步左边一条竖线，末行是叠加后的结果 */
.an-build{margin:4px 0 0;padding:0;list-style:none}
.an-build li{border-left:2px solid var(--line);padding:3px 0 5px 9px;margin-left:2px}
.an-build li:last-child{border-left-color:var(--green)}
.an-build .a{font-weight:700}
.an-build .m{color:var(--sub);margin-left:6px;font-size:12px}
.an-build .r{margin-top:2px;color:var(--blue)}
.an-build li:last-child .r{color:var(--green);font-weight:700}
.an-word{display:flex;gap:7px;align-items:baseline;padding:2px 0}
.an-word .j{flex:0 0 27%;overflow-wrap:break-word}
.an-word .k{flex:0 0 32%;color:var(--sub);font-size:11.5px;overflow-wrap:break-word}
.an-word .m{color:var(--sub);min-width:0}
.qz-result{font-size:12.5px;font-weight:700;margin-top:4px}
.qz-result.ok{color:var(--green)}
.qz-result.ng{color:var(--red)}
.answer b{color:var(--green)}
.passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:8px 0;white-space:pre-wrap}
.meta{color:var(--sub);font-size:13px}
.keigo{background:var(--amber-soft);border-radius:10px;padding:10px 14px;margin-top:16px}
.keigo h4{margin:0 0 6px;font-size:15px;color:var(--amber)}
.keigo li{font-size:14px}
/* vocab rows */
.vrow{display:flex;gap:10px;padding:8px 0;border-top:1px dashed var(--line);align-items:flex-start}
.vrow:first-child{border-top:0}
.vjp{flex:0 0 42%;min-width:0;font-size:16px;font-weight:600;word-break:break-word}
.vmn{flex:1;min-width:0}
.vcn{color:var(--ink);word-break:break-word}
.ven{color:var(--sub);font-size:12.5px;display:block}
.vrel{color:var(--green);font-size:12.5px;display:block;margin-top:2px;word-break:break-word}
.vnote{color:var(--sub);font-size:12px;display:block;margin-top:2px;font-style:italic}
.fillin-pat{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:8px 12px;font-size:14.5px;margin-bottom:8px;font-weight:600}
@media (max-width:520px){
  .vrow{flex-direction:column;gap:2px}
  .vjp{flex:none;width:100%}
}
.kanji-card{padding:6px 16px}
.krow{display:flex;gap:14px;padding:14px 0;border-top:1px dashed var(--line);align-items:flex-start}
.krow:first-child{border-top:0}
.kchar-wrap{flex:0 0 auto;width:74px;text-align:center}
.kchar{font-size:42px;font-weight:700;line-height:1.1}
.kmeta{color:var(--sub);font-size:11px;margin-top:2px}
.kreads{color:var(--blue);font-size:12.5px;margin-top:2px;line-height:1.6}
.kread{white-space:nowrap;display:inline-block}
.kread+.kread::before{content:"　"}
.kwords{flex:1;min-width:0}
@media (max-width:520px){
  .krow{gap:10px}
  .kchar-wrap{width:56px}
  .kchar{font-size:32px}
}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:none;background:none;color:var(--sub);font-size:11.5px;padding:7px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.bottom button .ic{font-size:19px;line-height:1.2}
nav.bottom button.on{color:var(--accent);font-weight:700}
.search-box{display:flex;gap:8px;margin-bottom:12px}
.search-box input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px;background:var(--card);color:var(--ink);outline:none}
.search-box input:focus{border-color:var(--blue)}
.search-hist{margin-bottom:14px}
.search-hist-h{color:var(--sub);font-size:12.5px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.search-hist-h a{color:var(--blue);cursor:pointer;font-size:12.5px}
.search-hist-chips{display:flex;flex-wrap:wrap;gap:8px}
.hist-chip{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:13.5px;cursor:pointer}
.hist-chip:hover{border-color:var(--blue);color:var(--blue)}
.result{cursor:pointer}
.result .where{color:var(--sub);font-size:12.5px}
.mtag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-right:6px;vertical-align:middle}
.mtag.g{background:var(--accent-soft);color:var(--accent)}
.mtag.g2{background:var(--amber-soft);color:var(--amber)}
.mtag.v{background:var(--blue-soft);color:var(--blue)}
.mtag.k{background:var(--green-soft);color:var(--green)}
.mtag.v2{background:var(--amber-soft);color:var(--amber)}
.mtag.k2{background:var(--amber-soft);color:var(--amber)}
.mtag.g4{background:var(--red-soft);color:var(--red)}
.mtag.v4{background:var(--blue-soft);color:var(--blue)}
.mtag.k4{background:var(--green-soft);color:var(--green)}
.hl{background:var(--amber-soft);color:var(--amber);font-weight:700;padding:0 1px;border-radius:3px}
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc-filter{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.fc-filter button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;font-size:13.5px;cursor:pointer}
.fc-filter button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fcard{width:100%;max-width:520px;min-height:280px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.fcard .big{font-size:26px;font-weight:700}
.fcard .hint{color:var(--sub);font-size:12.5px;margin-top:16px}
.fcard .backside{text-align:left;width:100%}
.fc-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fc-btns button{flex:1 1 auto;min-width:92px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 16px;font-size:15px;cursor:pointer;white-space:nowrap}
.fc-btns button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.fc-prog{color:var(--sub);font-size:13px}
table.ref{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}

<script>
let DATA={}, G={weeks:[]}, V={weeks:[]}, K={weeks:[]}, G2={weeks:[]}, V2={weeks:[]}, K2={weeks:[]}, G4={weeks:[]}, V4={weeks:[]}, K4={weeks:[]}, dataLoaded=false, n2Loaded=false, n4Loaded=false;
let _lastRenderedHash=null; // only scroll-to-top on an actual navigation, not on a background-sync re-render of the same view
let MODULE = 'grammar';
try{ const m=localStorage.getItem('module'); if(['vocab','grammar','n2grammar','kanji','n2vocab','n2kanji','n4grammar','n4vocab','n4kanji'].includes(m)) MODULE=m; }catch(e){}
let lastVisit={};
try{ lastVisit=JSON.parse(localStorage.getItem('lastVisit')||'{}')||{}; }catch(e){ lastVisit={}; }
let lastDay={};
try{ lastDay=JSON.parse(localStorage.getItem('lastDay')||'{}')||{}; }catch(e){ lastDay={}; }
function entryHash(mod){ return lastVisit[mod] || '#/'; }
function saveLastVisit(hash){
  lastVisit[MODULE] = hash;
  // 首页手风琴要知道「上次看的是哪一周」，而 lastVisit 回首页时会被覆盖成 '#/'，
  // 所以单独留一份只记天的，跨会话也保住展开位置。
  if(hash.startsWith('#/day/')) { lastDay[MODULE] = hash; try{ localStorage.setItem('lastDay', JSON.stringify(lastDay)); }catch(e){} }
  try{ localStorage.setItem('lastVisit', JSON.stringify(lastVisit)); }catch(e){}
}
let LANG = 'cn';
try{ const l=localStorage.getItem('lang'); if(l==='en'||l==='cn') LANG=l; }catch(e){}
const LX = (cn,en)=> (LANG==='en' && en) ? en : (cn||'');
const CUR = ()=> ({vocab:V, n2grammar:G2, kanji:K, n2vocab:V2, n2kanji:K2, n4grammar:G4, n4vocab:V4, n4kanji:K4}[MODULE]) || G;
const isGram = ()=> MODULE==='grammar'||MODULE==='n2grammar'||MODULE==='n4grammar';
const MODLABELS = {grammar:['N3 语法','N3 Grammar'], n2grammar:['N2 语法','N2 Grammar'], vocab:['N3 词汇','N3 Vocabulary'], kanji:['N3 汉字','N3 Kanji'], n2vocab:['N2 词汇','N2 Vocabulary'], n2kanji:['N2 汉字','N2 Kanji'], n4grammar:['N4 语法','N4 Grammar'], n4vocab:['N4 词汇','N4 Vocabulary'], n4kanji:['N4 汉字','N4 Kanji']};
const modLabel = ()=> LX(...MODLABELS[MODULE]);

const $ = s=>document.querySelector(s);
const app=$('#app'), titleEl=$('#title'), backBtn=$('#backBtn'), topAction=$('#topAction'), lvChip=$('#lvChip');
const esc = s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s=>esc(s).replace(/~([^~]+)~/g,'<del>$1</del>');
const R = (o,f)=>(o&&o[f+'_r'])||esc(o?o[f]:'');
try{ if(localStorage.getItem('noruby')==='1') document.body.classList.add('no-ruby'); }catch(e){}
try{ if(localStorage.getItem('hidejp')==='1') document.body.classList.add('hide-jp'); }catch(e){}
try{ if(localStorage.getItem('hidecn')==='1') document.body.classList.add('hide-cn'); }catch(e){}

  const off = document.body.classList.contains('no-ruby');

function memBarHTML(){
  const on=(cls)=>document.body.classList.contains(cls)?'on':'';

}

  const bar=document.querySelector('.mem-bar'); if(!bar) return;
  const btns=bar.querySelectorAll('button');

/* ---- TTS (朗读) ---- */
const escAttr = s=>esc(s).replace(/"/g,'&quot;');
let jaVoice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices()||[]; jaVoice=vs.find(v=>/^ja/i.test(v.lang))||vs.find(v=>/japan/i.test(v.name))||null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function say(t){ try{ if(!('speechSynthesis' in window)||!t) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.9; if(jaVoice)u.voice=jaVoice; speechSynthesis.speak(u); }catch(e){} }
function sayBtn(t){ return t?`<button class="sayb" data-say="${escAttr(t)}" aria-label="朗读">🔊</button>`:''; }

/* ---- 收藏 (生词本) ---- 本地 localStorage 即时可用，同时后台与 /api/favorites (Cloudflare KV) 同步实现跨设备 */
/* ---------- 错题/生词本 (自己录入的错题、忘记的单词/语法，纯本地存储) ---------- */
// 只保留结构正常的条目（必须有字符串 id），挡掉脏数据：没有 id 的记录既删不掉又会在合并时无限复活
const MISTAKE_TYPES={q:'错题', word:'单词', grammar:'语法'};
const MISTAKE_LEVELS={new:'不熟', mid:'一般', done:'已掌握'};
const MISTAKE_LEVEL_ORDER=['new','mid','done'];
function cleanMistakes(arr){ return Array.isArray(arr) ? arr.filter(m=>m && typeof m.id==='string' && m.id).map(m=> MISTAKE_LEVELS[m.level] ? m : Object.assign({}, m, {level:'new'})) : []; }
let MISTAKES=[]; try{ MISTAKES=cleanMistakes(JSON.parse(localStorage.getItem('mistakes')||'[]')); }catch(e){ MISTAKES=[]; }
let mistakeAddType='q';
let _mistakeSyncing=false, _mistakePushTimer=null, _mistakesReady=false, _mistakesPendingPush=false;
function pushMistakesNow(){
  fetch('/api/mistakes', {method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify(MISTAKES)}).catch(()=>{});
}
function saveMistakes(){

  if(_mistakeSyncing) return; // 刚从服务器拉取时不要把同一份数据立刻推回去

async function pullMistakesFromServer(){
  try{
    const res = await fetch('/api/mistakes', {cache:'no-store'});
    if(res.ok){
      const data = await res.json();
      if(Array.isArray(data)){
        _mistakeSyncing = true;
        // 合并而非整体覆盖：拉取完成前本地新增的条目（服务器还没有）要保留下来
        const merged = cleanMistakes(data);
        for(const m of MISTAKES){ if(!data.some(d=>d.id===m.id)) merged.push(m); }
        merged.sort((a,b)=>b.ts-a.ts);
        MISTAKES = merged;
        try{ localStorage.setItem('mistakes', JSON.stringify(MISTAKES)); }catch(e){}
        _mistakeSyncing = false;
        render();
      }
    }
  }catch(e){ /* 离线或本地 file:// 打开时静默失败，继续用本地缓存 */ }
  _mistakesReady = true;
  if(_mistakesPendingPush){ _mistakesPendingPush=false; saveMistakes(); }
}
function addMistake(type, text){

}
// 墓碑式删除：保留一个 {deleted:true} 标记并同步上去，别的设备据此隐藏，
// 这样删除能跨设备传播，又不会在合并时把它当成“本地独有”复活。
function deleteMistake(id){
  const e = MISTAKES.find(m=>m.id===id);
  if(e){ e.deleted=true; e.ts=e.ts||Date.now(); }

}

  const m = MISTAKES.find(x=>x.id===id); if(!m) return;

  m.level = MISTAKE_LEVEL_ORDER[(i+1) % MISTAKE_LEVEL_ORDER.length];

    const qText=(qEl.querySelector('.jp')||{}).textContent||'';
    const pickedBtn=wrap.querySelector(`[data-optidx="${picked}"]`);
    const correctBtn=wrap.querySelector(`[data-optidx="${correct}"]`);

/* 数字页吸顶目录：跟着滚动高亮当前小节，并把高亮的胶囊拉回可视范围。
   render() 每次都会重建 DOM，所以这里用一个常驻监听器＋存在性判断，不需要销毁逻辑。 */
function updateNumNavActive(){
  const nav = document.querySelector('.num-nav');
  if(!nav) return;
  const heads = document.querySelectorAll('.num-sec-h');
  if(!heads.length) return;
  const line = nav.getBoundingClientRect().bottom + 4;
  let activeId = heads[0].id;
  heads.forEach(h=>{ if(h.getBoundingClientRect().top <= line) activeId = h.id; });
  let onEl = null;
  nav.querySelectorAll('a').forEach(a=>{
    const on = a.dataset.scroll === activeId;
    a.classList.toggle('on', on);
    if(on) onEl = a;
  });
  if(onEl){ // 只在胶囊确实跑出视野时才横向滚动，避免和手动滑动打架
    const nr = nav.getBoundingClientRect(), ar = onEl.getBoundingClientRect();
    if(ar.left < nr.left || ar.right > nr.right) nav.scrollLeft += ar.left - nr.left - 12;
  }
}
let _numNavTick = false;
window.addEventListener('scroll', ()=>{
  if(_numNavTick) return;
  _numNavTick = true;
  requestAnimationFrame(()=>{ _numNavTick = false; updateNumNavActive(); });
}, {passive:true});
function render(){
  if(!dataLoaded){ app.innerHTML='<div class="empty">加载中…</div>'; return; }

  if(h==='#/search' && !n2Loaded){ setNav('search'); setHeader(LX('搜索（语法 + 词汇）','Search (Grammar + Vocabulary)'), false); app.innerHTML='<div class="empty">词典数据加载中，马上就好…</div>'; return; }
  syncModeBar();
  const sameView = (h===_lastRenderedHash);
  if(!sameView) window.scrollTo(0,0);
  // <details> 的展开状态只存在 DOM 里，重画同一个页面时要自己收好再放回去
  const openSnap = sameView ? Array.from(app.querySelectorAll('details')).map(d=>d.open) : null;
  const qzSnap   = sameView ? snapshotQz() : null;
  _lastRenderedHash = h;

  else if(h==='#/search') viewSearch();
  else if(h==='#/cards') viewCards();
  else if(h==='#/favs') viewFavs();
  // 接续表 / 活用表 / 数字表达讲的是日语本身，任何模块下都能直接看，不改当前模块。
  // 辨析不同：它的内容就是 N3 语法的家族对照，跳转链接也指向 N3 语法的某天，所以仍要切过去。
  else if(h==='#/ref') viewRef();

  else if(h==='#/contrast'){ const cm=contrastModule(); if(MODULE!==cm) setModule(cm); viewContrast(); }
  else if(h==='#/mistakes') viewMistakes();
  else {
    let m = h.match(/^#\/day\/(\d)-(\d)(?:\/(p\d+|v\d+-\d+|k\d+))?$/);
    if(m){
      saveLastVisit(`#/day/${m[1]}-${m[2]}`);
      viewDay(+m[1], +m[2], m[3]||null);
    }
    else viewHome();
  }
  if(openSnap){
    const ds = app.querySelectorAll('details');
    // 数量对不上说明画的不是同一份内容，硬套会张冠李戴，宁可不还原
    if(ds.length===openSnap.length) ds.forEach((d,i)=>{ d.open = openSnap[i]; });
  }
  restoreQz(qzSnap);
  updateStickyVars();
}

function parseCircledAnswers(str){
  const map={};
  if(!str) return map;
  let i=0;
  while(i<str.length){
    const ci = CIRCLED_NUMS.indexOf(str[i]);
    if(ci>=0){
      let j=i+1, num='';
      while(j<str.length && /[0-9]/.test(str[j])){ num+=str[j]; j++; }
      if(num) map[ci+1]=+num;
      i=j;
    } else i++;
  }
  return map;
}

/* 接続的排版。书里用三层分隔符，之前全当普通文字渲染，挤成一段还会在分隔符处换行：
     「；」「　」「❶❷」 顶层分组      「／」 并列候选      「＋」 前接与后接的连接点
   注意 ASCII 的 "/"（V/A/na/N 这种）不是分隔符，只有全角「／」是，所以只切全角。
   「＋」正好一个时才当连接点拆前后两半；出现多个说明它属于各个候选内部（如
   Aくて＋仕方がない／naで＋しょうがない），那就只按「／」切，别拆坏。 */
function connLines(seg, isTail){
  return seg.split('／').map(s=>s.trim()).filter(Boolean).map((s,i)=>{
    // 后接有多个候选时，除第一行外用一个隐形的「＋」占位，让它们跟第一行对齐，
    // 不然第二行会顶到最左边，看着像是又回到了前接
    const mark = isTail ? `<span class="conn-plus"${i?' style="visibility:hidden"':''}>＋</span>` : '';
    return `<div class="conn-line${isTail?' tail':''}">${mark}${fmt(s)}</div>`;
  }).join('');
}
function connHTML(str){
  return String(str||'').split(/[；　]/).map(s=>s.trim()).filter(Boolean).map(g=>{
    const parts = g.split('＋');
    // 后接另起一行并带上「＋」，否则接在候选后面会被当成又一个候选
    const body = parts.length===2
      ? connLines(parts[0], false) + connLines(parts[1], true)
      : connLines(g, false);
    return `<div class="conn-grp">${body}</div>`;
  }).join('');
}
function connBlockHTML(p){
  if(!p.connection) return '';
  const hint = /~[^~]+~/.test(p.connection) ? `<span class="conn-hint">（划线部分去掉）</span>` : '';
  return `<div class="conn jp"><span class="conn-label">接続${hint}</span>${connHTML(p.connection)}</div>`;
}
function pointHTML(p, wid, i){
  const pid = MODULE+'#'+wid+'#'+i, pw=wid.split('-')[0], pd=wid.split('-')[1];
  const psnap = {module:MODULE, hash:'#/day/'+wid+'/p'+i, w:pw, d:pd, jp:p.pattern, cn:p.usage_cn||''};
  const puse = LX(p.usage_cn, p.usage_en);
  let h = `<div class="point" id="pt-${wid}-${i}">
    <h3 class="jp">${R(p,'pattern')}</h3>${star(pid,psnap)}${sayBtn(p.pattern)}
    ${p.reading?`<div class="reading jp">${esc(p.reading)}</div>`:''}
    ${connBlockHTML(p)}
    ${p.usage_jp?`<div class="usage jp">${R(p,'usage_jp')}</div>`:''}
    ${puse?`<div class="usage"><span class="cn">${esc(puse)}</span></div>`:''}`;
  for(const ex of (p.examples||[])){ const exTx=LX(ex.cn, ex.en); h += `<div class="ex"><div class="jp">${R(ex,'jp')}${sayBtn(ex.jp)}</div>${ex.eq?`<div class="eq jp">（${R(ex,'eq')}）</div>`:''}${exTx?`<div class="cn">${esc(exTx)}</div>`:''}</div>`; }
  for(const nt of (p.notes||[])) h += `<div class="${noteClass(nt.type)}"><b class="nt">${esc(noteLabel(nt.type))}</b><span class="jp">${R(nt,'text')}</span></div>`;
  return h + `</div>`;
}

/* 别册里一道题可能带：一句 note、译文、四个选项各自的讲解、要点、生单词。
   答对答错都要能复盘，所以整块跟原来的 note 一样，答完题才显示。 */
function examNoteHTML(a, it){
  const opts = it.opts_r || (it.opts||[]).map(esc);
  let h = a.note ? `<div class="jp">${R(a,'note')}</div>` : '';
  if(a.trans) h += `<div class="an-trans">${esc(a.trans)}</div>`;
  // 跳到这道题考的那个语法点。标题从课程数据现取，改了课程这里跟着变，不会对不上。
  if(a.link){
    const m = String(a.link).match(/^#\/day\/(\d+)-(\d+)\/p(\d+)$/);
    let label = '看语法点';
    if(m){
      const dy = findDay(+m[1], +m[2]), p = dy && (dy.points||[])[+m[3]];
      if(p) label = `第${m[1]}週${m[2]}日目 · <span class="jp">${R(p,'pattern')}</span>`;
    }
    h += `<div class="an-link" data-go="${escAttr(a.link)}">📘 ${label} ›</div>`;
  }
  const why = a.why||[], words = a.words||[];
  if(!why.length && !a.point && !words.length) return h;
  h += `<details class="an-more"><summary>详细解析</summary>`;
  if(why.length) h += `<ol class="an-why">` + why.map((t,i)=>
    `<li class="${(i+1)===a.ans?'ok':''}"><span class="o jp">${opts[i]||''}</span><span class="w">${esc(t)}</span></li>`).join('') + `</ol>`;
  if(a.point) h += `<div class="an-point">要点：${esc(a.point)}</div>`;
  // 逐节拆解：把句子切成一个个成分，说清每一节在句子里干什么
  if((a.parse||[]).length) h += `<div class="an-h">逐节拆解</div><div class="an-words an-parse">` + a.parse.map(v=>
    `<div class="an-word"><span class="j jp">${esc(v.t)}</span>${(v.k&&v.k!=='—')?`<span class="k jp">${esc(v.k)}</span>`:''}<span class="m">${esc(v.r)}</span></div>`).join('') + `</div>`;
  // 层层叠加：从最里层的动词开始，一层层接上去，看清整个句型是怎么长出来的
  if((a.build||[]).length) h += `<div class="an-h">怎么一层层搭起来的</div><ol class="an-build">` + a.build.map((s,i)=>
    `<li><span class="a jp">${i?'＋':''}${esc(s.add)}</span><span class="m">${esc(s.mean)}</span>` +
    (s.res===s.add ? '' : `<div class="r jp">${esc(s.res)}</div>`) + `</li>`).join('') + `</ol>`;

/* ---------- search (cross-module) ---------- */
let searchIndex=null;
function buildIndex(){
  if(searchIndex) return searchIndex;
  searchIndex=[];
  const pushG = (mod, weeks)=>{ for(const w of weeks) for(const d of w.days) (d.points||[]).forEach((p,i)=>{
    searchIndex.push({module:mod, w:w.n,d:d.day,i, key:p.pattern||'', reading:p.reading||'',
      extra:((p.connection||'').replace(/~/g,''))+' '+(p.usage_jp||'')+' '+(p.usage_cn||'')+' '+(p.examples||[]).map(e=>e.jp+' '+(e.cn||'')).join(' '),
      sub:p.usage_cn||'', dayTitle:d.title});
  }); };
  pushG('grammar', G.weeks);
  pushG('n2grammar', G2.weeks);
  pushG('n4grammar', G4.weeks);
  const pushV = (mod, weeks)=>{ for(const w of weeks) for(const d of w.days) (d.sections||[]).forEach((sec,si)=>(sec.items||[]).forEach((it,ii)=>{
    searchIndex.push({module:mod, w:w.n,d:d.day, si, ii, key:it.jp||'', reading:'',
      extra:(it.en||'')+' '+(it.cn||'')+' '+(it.rel||''), sub:[it.cn,it.en].filter(Boolean).join(' · '), dayTitle:d.title});
  })); };
  pushV('vocab', V.weeks);
  pushV('n2vocab', V2.weeks);
  pushV('n4vocab', V4.weeks);
  const pushK = (mod, weeks)=>{ for(const w of weeks) for(const d of w.days) (d.kanji||[]).forEach((k,ki)=>(k.words||[]).forEach(wd=>{
    searchIndex.push({module:mod, w:w.n,d:d.day, ki, key:wd.jp||'', reading:wd.reading||'',
      extra:(wd.en||'')+' '+(wd.cn||'')+' '+(k.char||''), sub:[wd.cn,wd.en].filter(Boolean).join(' · '), dayTitle:d.title});
  })); };
  pushK('kanji', K.weeks);
  pushK('n2kanji', K2.weeks);
  pushK('n4kanji', K4.weeks);
  return searchIndex;
}
const SEARCH_HIST_KEY='searchHistory', SEARCH_HIST_MAX=15;
function getSearchHistory(){ try{ return JSON.parse(localStorage.getItem(SEARCH_HIST_KEY)||'[]'); }catch(e){ return []; } }
function saveSearchHistory(kw){
  if(!kw) return;
  try{
    let h=getSearchHistory().filter(x=>x!==kw);
    h.unshift(kw);
    localStorage.setItem(SEARCH_HIST_KEY, JSON.stringify(h.slice(0,SEARCH_HIST_MAX)));
  }catch(e){}
}
function clearSearchHistory(){ try{ localStorage.removeItem(SEARCH_HIST_KEY); }catch(e){} }
let lastSearchKw='';
function viewSearch(){
  setNav('search'); setHeader(LX('搜索（语法 + 词汇）','Search (Grammar + Vocabulary)'), false);
  const total=buildIndex().length;
  app.innerHTML = `<div class="search-box"><input id="q" type="search" placeholder="日文 / 假名 / 中文 / 英文，如：ばかり · 冰箱 · fridge" autocomplete="off"></div><div id="results"></div>`;
  const q=$('#q'), res=$('#results'); q.focus();
  q.oninput = ()=>{
    const kw=q.value.trim();
    lastSearchKw=kw;
    if(!kw){
      const h=getSearchHistory();
      const histHTML = h.length ? `<div class="search-hist"><div class="search-hist-h"><span>最近搜索</span><a data-histclear>清空</a></div><div class="search-hist-chips">${h.map(x=>`<span class="hist-chip" data-histq="${esc(x)}">${esc(x)}</span>`).join('')}</div></div>` : '';
      res.innerHTML = `${histHTML}<div class="empty">共收录 ${total} 条（语法点 + 词汇）<br>结果标注所属模块，点击直达</div>`;
      return;
    }
    const lk=kw.toLowerCase();
    const hits=buildIndex().filter(e=> e.key.toLowerCase().includes(lk)||e.reading.includes(kw)||e.extra.toLowerCase().includes(lk)).slice(0,60);
    if(!hits.length){ res.innerHTML='<div class="empty">没有找到，换个关键词试试</div>'; return; }
    const mark=s=>{ const t=esc(s); if(!kw) return t; try{ return t.split(esc(kw)).join(`<span class="hl">${esc(kw)}</span>`);}catch(e){return t;} };
    res.innerHTML = hits.map((e,ix)=>{
      const tag = {grammar:'<span class="mtag g">N3语法</span>', n2grammar:'<span class="mtag g2">N2语法</span>', vocab:'<span class="mtag v">N3词汇</span>', kanji:'<span class="mtag k">N3汉字</span>', n2vocab:'<span class="mtag v2">N2词汇</span>', n2kanji:'<span class="mtag k2">N2汉字</span>', n4grammar:'<span class="mtag g4">N4语法</span>', n4vocab:'<span class="mtag v4">N4词汇</span>', n4kanji:'<span class="mtag k4">N4汉字</span>'}[e.module];
      window['__hit'+ix]=e;
      return `<div class="card result" data-hit="${ix}">
        <div class="jp" style="font-size:16.5px;font-weight:700">${tag}${mark(e.key)}</div>
        ${e.sub?`<div class="meta">${mark(e.sub)}</div>`:''}
        <div class="where">第${e.w}週 ${e.d}日目 · <span class="jp">${esc(e.dayTitle)}</span></div>
      </div>`;
    }).join('');
  };
  q.onkeydown = ev=>{ if(ev.key==='Enter' && q.value.trim()) saveSearchHistory(q.value.trim()); };
  q.oninput();
}
window.openHit = ix=>{
  const e=window['__hit'+ix]; if(!e) return;

let fc={week:0, deck:[], idx:0, flipped:false};
function buildDeck(week){
  const deck=[];
  if(isGram()){
    for(const w of CUR().weeks){ if(week&&w.n!==week) continue; for(const d of w.days) (d.points||[]).forEach((p,i)=>deck.push({w:w.n,d:d.day,i,p})); }
  } else if(MODULE==='kanji'||MODULE==='n2kanji'||MODULE==='n4kanji'){
    for(const w of CUR().weeks){ if(week&&w.n!==week) continue; for(const d of w.days) (d.kanji||[]).forEach(k=>{ if(k.words&&k.words.length) deck.push({k}); }); }
  } else {
    for(const w of CUR().weeks){ if(week&&w.n!==week) continue; for(const d of w.days) (d.sections||[]).forEach(sec=>(sec.items||[]).forEach(it=>{ if(it.jp&&(it.cn||it.en)) deck.push({v:it}); })); }
  }
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  return deck;
}

/* ---------- contrast (语法辨析, N3 grammar only) ---------- */
let ctMode='family', ctWeek=1;
// 每个语法家族末尾的辨析练习：选项就是这一族的成员，逼着你在易混形式之间做选择。
// 复用 examGrammarHTML 那套 .q/.qz/.qz-result/.qz-note 结构，所以判对错、显示解析、
// 答错自动记进错题本这些行为全都是现成的，不需要新的事件处理。
function ctQuizHTML(g){
  const qz = g.quiz;
  if(!qz || !(qz.items||[]).length) return '';
  const ansMap = parseCircledAnswers(qz.answers);
  const qs = qz.items.map(it=>{
    const correct = ansMap[it.n];
    let h = `<div class="q"><span class="n">${it.n}</span><span class="jp">${R(it,'q')}</span>`;
    h += quizOptsHTML(it, correct!=null?correct:null);
    if(correct!=null){
      h += `<div class="qz-result"></div>`;
      if(it.note) h += `<div class="qz-note">${esc(it.note)}</div>`;
    }
    return h + `</div>`;
  }).join('');
  return `<details class="ct-quiz"><summary>✍️ ${esc(qz.title||'辨析练习')}（${qz.items.length}题）</summary>${qs}</details>`;
}
// 辨析属于「某一级的语法」这一层，每级语法各有一份，所以跟着当前语法模块走。
// 不在语法模块时优先切到同级别的语法；那一级没有辨析数据就退回 N3。
function hasContrast(mod){ return !!((DATA[mod]||{}).contrast); }
function contrastModule(){
  if(isGram() && hasContrast(MODULE)) return MODULE;
  const same = moduleFrom(LEVEL,'grammar');
  return hasContrast(same) ? same : 'grammar';
}
function viewContrastFamily(){
  const C = CUR().contrast || {groups:[]};
  const groups = C.groups||[];
  const toc = groups.map((g,i)=>`<a class="ct-tocitem" data-scroll="ct-g-${i}">${esc(g.title)}</a>`).join('');
  let body = C.intro ? `<div class="meta" style="margin-bottom:10px">${esc(C.intro)}</div>` : '';
  groups.forEach((g,i)=>{
    body += `<div class="card ct-card" id="ct-g-${i}"><h3 class="ct-h jp">${esc(g.title)}</h3>`;
    if(g.tip) body += `<div class="ct-tip">💡 ${esc(g.tip)}</div>`;
    for(const r of (g.rows||[])){
      body += `<div class="ct-row"><div class="ct-form jp">${r.form_r||esc(r.form)}<span class="ct-loc" data-go="#/day/${esc(r.loc)}">${esc(r.loc)} ›</span></div>`
        + (r.eg?`<div class="ct-eg jp">例：${r.eg_r||esc(r.eg)}</div>`:'')

        + `<div class="ct-mean">${esc(r.mean)}</div></div>`;
    }
    body += ctQuizHTML(g);
    body += `</div>`;
  });
  return `<div class="ct-wrap"><nav class="ct-toc"><div class="ct-toc-h">目录</div>${toc}</nav><div class="ct-body">${body}</div></div>`;
}
function viewContrastWeek(){
  const weeks = CUR().weeks||[];

  const wkBar = weeks.map(w=>`<button class="${ctWeek===w.n?'on':''}" data-ctweek="${w.n}">第${w.n}周</button>`).join('');

    const [g,v,k,com]=await Promise.all(names.map(n=>fetch('data/'+DATA_FILES[n]).then(r=>r.json())));
    G=g; V=v; K=k;
    DATA.grammar=G; DATA.vocab=V; DATA.kanji=K; DATA.common=com;
    dataLoaded=true;
  }catch(e){ app.innerHTML='<div class="empty">数据加载失败，请检查网络后刷新重试。</div>'; return; }
  render();
  bootN2(); // N3 优先，N2 随后低优先级加载
}
async function bootN2(){
  try{
    const names=['n2grammar','n2vocab','n2kanji'];
    const [g2,v2,k2]=await Promise.all(names.map(n=>fetch('data/'+DATA_FILES[n]).then(r=>r.json())));
    G2=g2; V2=v2; K2=k2;
    DATA.n2grammar=G2; DATA.n2vocab=V2; DATA.n2kanji=K2;
    n2Loaded=true;
    searchIndex=null; // N2 数据到位后让搜索索引下次重新构建，纳入N2结果
    const h=location.hash||'#/';
    if(MODULE==='n2grammar'||MODULE==='n2vocab'||MODULE==='n2kanji'||h==='#/search') render();
  }catch(e){ /* N2 加载失败时静默：N3 内容不受影响，用户切到N2或搜索时会看到持续的加载提示 */ }
  bootN4(); // N2 之后最后加载 N4（数据量最小，优先级最低）
}
async function bootN4(){
  try{
    const names=['n4grammar','n4vocab','n4kanji'];
    const [g4,v4,k4]=await Promise.all(names.map(n=>fetch('data/'+DATA_FILES[n]).then(r=>r.json())));
    G4=g4; V4=v4; K4=k4;
    DATA.n4grammar=G4; DATA.n4vocab=V4; DATA.n4kanji=K4;
    n4Loaded=true;
    searchIndex=null; // N4 数据到位后让搜索索引下次重新构建，纳入N4结果
    const h=location.hash||'#/';
    if(MODULE==='n4grammar'||MODULE==='n4vocab'||MODULE==='n4kanji'||h==='#/search') render();
  }catch(e){ /* N4 加载失败时静默 */ }
}
render();
bootN3();
pullFavsFromServer();
pullMistakesFromServer();

/* 切回页面（可见/获得焦点）时自动重新同步：与云端合并，反映另一台设备的新增，
   删除通过墓碑标记传播。本地若还有未推送完的改动（防抖计时器未触发）则跳过这轮。 */
let _resyncingM=false, _resyncingF=false;
/* 切回标签页就会 resync 一次，而绝大多数时候拉回来的跟本地一模一样。
   以前不管变没变都 render()，整页重建，正在做的实战题、展开的详细解析、
   输入到一半的错题草稿全没了。所以先比对内容，真变了才重画。 */
function mistakesSig(arr){
  return JSON.stringify(arr.map(m=>[m.id,m.type,m.text,m.level,m.ts]).sort((a,b)=>a[0]<b[0]?-1:1));
}
function favsSig(o){ return JSON.stringify(Object.keys(o).sort().map(k=>[k,o[k]])); }
async function resyncMistakes(){
  if(!_mistakesReady || _mistakePushTimer || _resyncingM) return;
  _resyncingM=true;
  try{
    const res = await fetch('/api/mistakes', {cache:'no-store'});
    if(res.ok){
      const data = await res.json();
      if(Array.isArray(data)){
        const before = mistakesSig(MISTAKES);
        _mistakeSyncing=true;
        const merged = cleanMistakes(data);
        for(const m of MISTAKES){ if(!data.some(d=>d.id===m.id)) merged.push(m); }
        merged.sort((a,b)=>b.ts-a.ts);
        MISTAKES = merged;
        try{ localStorage.setItem('mistakes', JSON.stringify(MISTAKES)); }catch(e){}
        _mistakeSyncing=false;
        if(mistakesSig(MISTAKES)!==before) render();
      }
    }
  }catch(e){}
  _resyncingM=false;
}
async function resyncFavs(){
  if(!_favReady || _favPushTimer || _resyncingF) return;
  _resyncingF=true;
  try{
    const res = await fetch('/api/favorites', {cache:'no-store'});
    if(res.ok){
      const data = await res.json();
      if(data && typeof data==='object' && !Array.isArray(data)){
        const before = favsSig(FAV);
        _favSyncing=true;
        FAV = Object.assign({}, data, FAV);
        try{ localStorage.setItem('favs', JSON.stringify(FAV)); }catch(e){}
        _favSyncing=false;
        if(favsSig(FAV)!==before) render();
      }
    }
  }catch(e){}
  _resyncingF=false;
}
function resyncAll(){ resyncFavs(); resyncMistakes(); }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') resyncAll(); });
window.addEventListener('focus', resyncAll);
</script>
